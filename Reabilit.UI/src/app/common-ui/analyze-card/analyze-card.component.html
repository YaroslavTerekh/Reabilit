<div class="card">
    <div class="title">{{analysis.title}}</div>
    <div class="pressure">
      <span class="systolic">{{analysis.value}}</span>
      <span class="diastolic">{{analysis.unit}}</span>
    </div>
    <div class="icon-and-status">
      <img [src]="analysis.iconPath" alt="blood pressure" class="icon" />
      <span class="status" [ngClass]="analysis.isNormal ? 'status-green' : 'status-red'">{{analysis.isNormal ? 'Норма' : 'Аномалія'}}</span>
    </div>
  </div>
