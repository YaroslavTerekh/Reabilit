<div class="doctor-card">
  <div class="avatar">
    <img [src]="'man-doc.png'" alt="Лікар" />
  </div>
  <div class="info">
    <h3>{{ doctor.firstName }} {{ doctor.lastName }}</h3>
    <p class="specialty">{{ doctor.doctorClass.className }}</p>
    <p class="experience">Стаж: {{ doctor.experienceInYear }} років</p>
    <p class="bio">{{ doctor.biography }}</p>
  </div>
</div>
