<div class="doctor-card">
    <div class="doctor-image">
        <img src="man-doc.png" alt="Фото лікаря">
    </div>
    <div class="doctor-info">
        <h3 class="doctor-name">{{doctor.firstName}} {{doctor.lastName}}</h3>
        <p class="doctor-degree">{{doctor.degree}}</p>
        <p class="doctor-class">{{doctor.doctorClass.className}}</p>
        <p class="doctor-experience">Стаж: {{doctor.experienceInYear}} років</p>
        <p class="doctor-bio">{{doctor.biography}}</p>
    </div>
</div>
